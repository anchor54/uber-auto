# Render blueprint: the backend's API, its worker and a Postgres database.
#
# In Render: New → Blueprint → connect this repository. Render creates
# everything below and asks for the values marked `sync: false`:
#   OLA_MAPS_API_KEY                        (Ola Maps console; optional, else the demo places)
#   FCM_SERVICE_ACCOUNT_JSON (worker)       (Firebase service account key; optional, else pushes are logged)
# Then, once, from the API service's Shell:
#   ./bin/db seed-config                    (fare rules, ride types, places; never deletes)
# Full checklist: README.md → "Going live".
#
# Singapore is Render's closest region to India.
#
# STAGING until SMS is set up: APP_ENV is "staging", so the API starts
# without an SMS provider and writes each sign-in code to its log (only the
# Render account owner can read it). Fine for testing; not for real riders.
# Before launch (README.md → "Going live"): add MSG91_AUTH_KEY and
# MSG91_OTP_TEMPLATE_ID to commute-api (as `sync: false` entries), and set
# APP_ENV to production on both services. Production refuses to start
# without SMS.

databases:
  - name: commute-db
    databaseName: commute
    user: commute
    region: singapore
    plan: basic-256mb

services:
  - type: web
    name: commute-api
    runtime: go
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: ./bin/server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: commute-db
          property: connectionString
      - key: OTP_SECRET
        generateValue: true
      - key: OLA_MAPS_API_KEY
        sync: false
      # Map tiles cached in memory (MB); 0 turns the cache off.
      - key: MAP_TILE_CACHE_MB
        value: "64"
      # The web build on GitHub Pages calls the API from this origin.
      - key: CORS_ORIGINS
        value: https://anchor54.github.io

  # Everything that runs on a clock: rides 14 days ahead, "Leg is on",
  # late drivers, payment reminders, stale rides, sending notifications.
  - type: worker
    name: commute-worker
    runtime: go
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: ./bin/worker
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: commute-db
          property: connectionString
      - key: OTP_SECRET
        fromService:
          type: web
          name: commute-api
          envVarKey: OTP_SECRET
      # The worker sends push notifications: the Firebase service account's
      # whole JSON key file. Optional; without it pushes are only logged.
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
