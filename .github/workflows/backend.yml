name: Backend

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml', '.github/scripts/**']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml', '.github/scripts/**']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: backend
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: commute_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/commute_test
      OUT: ${{ github.workspace }}/ci-out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: mkdir -p "$OUT"
      - name: Formatting
        run: test -z "$(gofmt -l . | tee "$OUT/gofmt.txt")"
      - run: go vet ./... 2>&1 | tee "$OUT/vet.txt"
      - name: Production build (what Render runs)
        run: bash build.sh 2>&1 | tee "$OUT/build.txt"
      - if: always()
        run: go test -count=1 ./... 2>&1 | tee "$OUT/tests.txt"
      - name: Publish logs
        if: always()
        working-directory: .
        run: .github/scripts/publish-results.sh backend "$OUT"
