name: Driver app

on:
  push:
    branches: [main, spec-rewrite]
    paths: ['apps/driver/**', '.github/workflows/driver-app.yml', '.github/scripts/**']
  pull_request:
    paths: ['apps/driver/**', '.github/workflows/driver-app.yml', '.github/scripts/**']
  workflow_dispatch:

concurrency:
  group: driver-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    working-directory: apps/driver
    shell: bash

env:
  OUT: ${{ github.workspace }}/ci-out

jobs:
  test:
    name: Analyze, unit, widget and flow tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - name: Get packages
        run: |
          mkdir -p "$OUT"
          flutter --version | tee "$OUT/flutter-version.txt"
          flutter pub get 2>&1 | tee "$OUT/pub-get.txt"
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos > "$OUT/analyze.txt" 2>&1; rc=$?
          cat "$OUT/analyze.txt"
          exit $rc
      - name: Unit, widget and flow tests
        if: always()
        timeout-minutes: 10
        run: timeout -k 30 540 flutter test -j 1 --exclude-tags screenshots --timeout 60s --reporter expanded --no-color 2>&1 | tee "$OUT/tests.txt"
      - name: Publish logs
        if: always()
        working-directory: .
        run: .github/scripts/publish-results.sh driver-test "$OUT"

  build:
    name: Build Android APK and web app
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - name: Get packages
        run: mkdir -p "$OUT" && flutter pub get
      - name: Build APK
        # Real mode when the repository variable API_BASE_URL is set; demo mode otherwise.
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }} 2>&1 | tee "$OUT/build-apk.txt"
      - name: Build web
        run: flutter build web --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }} 2>&1 | tee "$OUT/build-web.txt"
      - name: Publish APK as the "driver-latest" download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk driver.apk
          if [ -n "${{ vars.API_BASE_URL }}" ]; then
            notes="Driver app against ${{ vars.API_BASE_URL }}. Built from ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER})."
          else
            notes="Driver app, demo mode. Built from ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER}). Sign-in code: 123456."
          fi
          gh release view driver-latest >/dev/null 2>&1 || gh release create driver-latest --prerelease --title "Driver app (latest build)" --notes "$notes"
          gh release edit driver-latest --notes "$notes"
          gh release upload driver-latest driver.apk --clobber
      - name: Publish logs
        if: always()
        working-directory: .
        run: .github/scripts/publish-results.sh driver-build "$OUT"
